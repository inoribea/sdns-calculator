name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win-x64
            pyinstaller-extras: --collect-all cryptography
          - os: macos-latest
            target: macos-x64
          - os: macos-latest
            target: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography

      - name: Build binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller --onefile --console ${{ matrix.pyinstaller-extras }} --name sdns-calculator-${{ matrix.target }} --distpath dist sdns-calculator.py
          pyinstaller --onefile --console ${{ matrix.pyinstaller-extras }} --name sdns-calculator-CN-${{ matrix.target }} --distpath dist sdns-calculator-CN.py
          pyinstaller --onefile --console ${{ matrix.pyinstaller-extras }} --name sdns-calculator-JP-${{ matrix.target }} --distpath dist sdns-calculator-JP.py

      - name: Build binaries (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          pyinstaller --onefile ${{ matrix.pyinstaller-extras }} --name sdns-calculator-${{ matrix.target }} --distpath dist sdns-calculator.py
          pyinstaller --onefile ${{ matrix.pyinstaller-extras }} --name sdns-calculator-CN-${{ matrix.target }} --distpath dist sdns-calculator-CN.py
          pyinstaller --onefile ${{ matrix.pyinstaller-extras }} --name sdns-calculator-JP-${{ matrix.target }} --distpath dist sdns-calculator-JP.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdns-calculator-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
