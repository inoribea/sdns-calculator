name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            pyinstaller-args: --onefile
          - os: windows-latest
            target: win-x64
            pyinstaller-args: --onefile --console
          - os: macos-latest
            target: macos-x64
            pyinstaller-args: --onefile
          - os: macos-latest
            target: macos-arm64
            pyinstaller-args: --onefile

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography

      - name: Build binaries
        run: |
          pyinstaller ${{ matrix.pyinstaller-args }} \
            --name sdns-calculator-${{ matrix.target }} \
            --distpath dist \
            sdns-calculator.py
          pyinstaller ${{ matrix.pyinstaller-args }} \
            --name sdns-calculator-CN-${{ matrix.target }} \
            --distpath dist \
            sdns-calculator-CN.py
          pyinstaller ${{ matrix.pyinstaller-args }} \
            --name sdns-calculator-JP-${{ matrix.target }} \
            --distpath dist \
            sdns-calculator-JP.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdns-calculator-${{ matrix.target }}
          path: dist/*

      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/*
          asset_name: sdns-calculator-${{ matrix.target }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          asset_content_type: application/octet-stream
